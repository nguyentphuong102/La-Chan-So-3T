<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Luyện 3 bước Tỉnh táo – Thẩm tra – Tự bảo vệ trước lừa đảo và mua bán người trên mạng.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lá chắn số 3T</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14202e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: một cột như màn hình điện thoại, thẻ trắng viền mảnh, bóng nhẹ; mỗi màn hình một việc; nút cứu hộ cố định ở đáy; tình huống "nhảy ra" như thông báo điện thoại. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --ink:#14202e; --muted:#51606f; --edge:#dde3ea; --shadow:#14202e; --soft:#e4e9ef;
  --elev:0 1px 2px rgba(20,32,46,.05),0 6px 18px rgba(20,32,46,.07); --elev2:0 18px 40px rgba(20,32,46,.22);
  --brand:#0f7d55; --brand2:#22b07a; --grad:linear-gradient(135deg,#0c6a49 0%,#14935f 55%,#2bb883 100%); --glow:0 8px 20px rgba(15,125,85,.28);
  --stroke:#13233a; --on-color:#13233a;
  --red:#e5484d; --red-ink:#b42318; --red-soft:#fdeeee;
  --yel:#f2b53a; --yel-ink:#80540a; --yel-soft:#fdf4e0;
  --grn:#1f9d63; --grn-ink:#12663f; --grn-soft:#e4f4eb;
  --sky:#3b9fe0; --sky-ink:#0b5d8c; --sky-soft:#e7f2fb;
  --sos:#d93025; --bubble:#e9eef2; --focus:#1f5fbf; --scrim:rgba(19,35,58,.5);
  --f-display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222b; --ink:#eef2f5; --muted:#a5b2bf; --edge:#2b3844; --shadow:#050b0d; --soft:#25313c;
  --elev:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25); --elev2:0 18px 40px rgba(0,0,0,.55); --brand:#6fd6a8;
  --stroke:#0b151a; --red-ink:#ff9b91; --red-soft:#3a1f1d; --yel-ink:#ffd36b; --yel-soft:#382d12;
  --grn-ink:#74e0a8; --grn-soft:#143325; --sky-ink:#8fd6ff; --sky-soft:#12303f; --bubble:#22353d; --focus:#8ab4ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222b; --ink:#eef2f5; --muted:#a5b2bf; --edge:#2b3844; --shadow:#050b0d; --soft:#25313c;
  --elev:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25); --elev2:0 18px 40px rgba(0,0,0,.55); --brand:#6fd6a8;
  --stroke:#0b151a; --red-ink:#ff9b91; --red-soft:#3a1f1d; --yel-ink:#ffd36b; --yel-soft:#382d12;
  --grn-ink:#74e0a8; --grn-soft:#143325; --sky-ink:#8fd6ff; --sky-soft:#12303f; --bubble:#22353d; --focus:#8ab4ff; --scrim:rgba(0,0,0,.6); color-scheme:dark}
:root.big{--fs:22px}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(6.5rem + env(safe-area-inset-bottom,0px));
  background-image:linear-gradient(180deg,var(--grn-soft) 0,var(--bg) 320px);background-repeat:no-repeat}
.wrap{max-width:30rem;margin:0 auto;position:relative}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--sky-ink)}
button{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1[tabindex="-1"]:focus{outline:none}

.chunk{background:var(--surface);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--elev);cursor:pointer;transition:transform .08s,box-shadow .08s}
.chunk:active{transform:translateY(1px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-block:.9rem .6rem}
.brand{display:flex;align-items:center;gap:.45rem;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-height:48px}
.brand b{font-family:var(--f-display);font-size:1.12rem;font-weight:800;line-height:1}
.tools{display:flex;gap:.3rem}
.tool{min-height:46px;min-width:44px;padding:0 .4rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;font-weight:700;font-size:.85rem;border-radius:14px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tool svg{width:22px;height:22px}
.shields{background:var(--grn-soft);color:var(--grn-ink);font-variant-numeric:tabular-nums}
@media (max-width:370px){.brand b{display:none}}

.view{display:grid;gap:1.1rem;padding-block:.4rem 1rem}
.lead{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:22px;padding:1.15rem 1.1rem 1.1rem;display:block;box-shadow:var(--glow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-90px}
.hero::after{width:140px;height:140px;left:-50px;bottom:-70px}
.hero > *{position:relative}
.hero-text{display:grid;gap:.55rem;min-width:0}
.hero-tag{justify-self:start;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.18);border-radius:999px;padding:.2rem .7rem}
.hero h1{font-size:1.45rem;line-height:1.2;color:#fff;max-width:calc(100% - 92px)}
.hero p{font-size:.92rem;color:rgba(255,255,255,.9)}
.hero-cta{justify-self:start;white-space:nowrap;min-height:50px;padding:0 1.3rem;border-radius:999px;border:0;background:#fff;color:#0f7d55;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.15);display:inline-flex;align-items:center;gap:.4rem}
.hero-cta svg{width:20px;height:20px}
.hero-cta:active{transform:translateY(1px)}
.hero-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.hero-chips span{font-size:.74rem;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.12rem .6rem}
.hero-m{position:absolute!important;right:10px;top:14px;width:84px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.sec-h h2{font-size:1.1rem}
.sec-h span{font-size:.82rem;color:var(--muted);font-weight:600}
.hello{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:end}
.hello .m{width:72px}
.say{position:relative;background:var(--surface);border:1px solid var(--edge);border-radius:14px 14px 14px 6px;padding:.75rem .9rem;font-weight:500;box-shadow:var(--elev);min-width:0}
.say b{font-family:var(--f-display);font-size:1.1rem;font-weight:700;display:block;line-height:1.25;margin-bottom:.15rem}
@media (prefers-reduced-motion:no-preference){
  .wave{transform-origin:100px 62px;animation:wave 1.6s ease-in-out 2}
  @keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(10deg)}}
  .pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
  .view{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}

.light3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.lamp{border-radius:16px;padding:.8rem .4rem .7rem;text-align:center;display:grid;justify-items:center;gap:.25rem;border:1px solid var(--edge)}
.lamp svg{width:54px;height:54px;padding:9px;background:var(--surface);border-radius:50%;box-shadow:var(--elev)}
.lamp b{font-family:var(--f-display);font-size:.98rem;font-weight:700;line-height:1.15}
.lamp small{font-size:.74rem;font-weight:600;line-height:1.25}
.l1{background:var(--red-soft);color:var(--red-ink)} .l2{background:var(--yel-soft);color:var(--yel-ink)} .l3{background:var(--grn-soft);color:var(--grn-ink)}

.menu{display:grid;gap:.8rem}
.mcard{display:grid;grid-template-columns:64px 1fr auto;gap:.8rem;align-items:center;width:100%;padding:.75rem .9rem;text-align:left;min-height:92px}
.mcard .art{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.mcard .art svg{width:40px;height:40px}
.mcard span{display:grid;gap:.1rem;min-width:0}
.mcard strong{font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.2}
.mcard em{font-style:normal;color:var(--muted);font-size:.86rem}
.mcard .go{width:28px;height:28px;color:var(--muted)}
.mcard.sos{background:var(--red-soft)} .mcard.sos strong{color:var(--red-ink)}
.bg-red{background:var(--red-soft)} .bg-yel{background:var(--yel-soft)} .bg-grn{background:var(--grn-soft)} .bg-sky{background:var(--sky-soft)}

.share{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center;background:var(--surface);border:1px dashed var(--edge);border-radius:14px;padding:.9rem}
.qr{width:120px;height:120px;border-radius:10px;overflow:hidden}
.share h3{margin-bottom:.2rem}
.share p{font-size:.84rem;color:var(--muted)}
.share > div{min-width:0}
.url{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;word-break:break-all;color:var(--ink);user-select:all;display:block;margin-top:.35rem}
.side{display:none}
@media (min-width:1100px){
  .side{display:grid;gap:.7rem;position:absolute;left:calc(100% + 2.5rem);top:5.5rem;width:15rem;background:var(--surface);
    border:1px solid var(--edge);border-radius:16px;padding:1.1rem;box-shadow:var(--elev);text-align:center;justify-items:center}
  .side .qr{width:180px;height:180px}
  .side p{font-size:.85rem;color:var(--muted)}
  .only-narrow{display:none!important}
}

.dots{display:flex;gap:.45rem;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--soft);border:1px solid var(--edge)}
.dots i.on{background:var(--ink)}
.lesson{border-radius:16px;padding:1.2rem 1.1rem;display:grid;gap:.8rem;border:1px solid var(--edge);box-shadow:var(--elev)}
.lesson .pic{display:grid;place-items:center;padding-block:.3rem}
.lesson .pic svg{width:132px;height:132px}
.lesson .tag{justify-self:start;font-family:var(--f-display);font-weight:700;font-size:.95rem;padding:.1rem .7rem;border-radius:99px;background:var(--surface);border:1px solid var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--surface);border:1px solid var(--edge);border-radius:99px;padding:.15rem .7rem;font-weight:600;font-size:.86rem}
.vs{display:grid;gap:.5rem}
.vs div{display:grid;grid-template-columns:30px 1fr;gap:.5rem;align-items:center;background:var(--surface);border-radius:14px;padding:.55rem .7rem;font-weight:600;font-size:.92rem}
.vs svg{width:28px;height:28px}

.btn{min-height:56px;padding:0 1.4rem;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;width:100%;
  background:var(--grad);color:#fff;border:0;box-shadow:var(--glow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--edge);box-shadow:none}
.btn.yel{background:var(--grad)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:grid;gap:.7rem}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:.6rem}

.deck{position:relative;height:214px;display:grid;place-items:center;margin-top:.3rem}
.dcard{position:absolute;width:150px;height:196px;border-radius:16px;border:1px solid var(--edge);box-shadow:var(--elev)}
.dcard.a{background:var(--sky-soft);transform:rotate(-6deg) translateX(-30px)}
.dcard.b{background:var(--red-soft);transform:rotate(6deg) translateX(30px)}
.dcard.c{background:var(--surface);color:var(--ink);display:grid;place-items:center;align-content:center;gap:0;text-align:center}
.dcard.c b{font-family:var(--f-display);font-size:4rem;line-height:.9;color:var(--grn)}
.dcard.c small{font-weight:700;font-size:.8rem;line-height:1.25;padding:0 .6rem}
@media (prefers-reduced-motion:no-preference){
  .deck.shuffle .a{animation:sa .5s ease-in-out} .deck.shuffle .b{animation:sb .5s ease-in-out} .deck.shuffle .c{animation:sc .5s ease-in-out}
  @keyframes sa{50%{transform:rotate(-2deg) translateX(0)}} @keyframes sb{50%{transform:rotate(2deg) translateX(0)}} @keyframes sc{50%{transform:translateY(-14px) rotate(-3deg)}}
}
.filters{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.filters span{font-weight:700;font-size:.85rem;color:var(--muted);margin-right:.1rem}
.fchip{min-height:44px;padding:0 .85rem;border-radius:99px;font-weight:700;font-size:.85rem;box-shadow:var(--elev)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.scard{display:grid;grid-template-columns:54px 1fr;gap:.75rem;align-items:center;width:100%;padding:.65rem .8rem;text-align:left}
.scard .art{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.scard .art svg{width:34px;height:34px}
.scard span{display:grid;gap:.2rem;min-width:0}
.scard strong{font-family:var(--f-display);font-size:1.08rem;line-height:1.15}
.badges{display:flex!important;flex-wrap:wrap;gap:.3rem}
.badge{font-size:.72rem;font-weight:700;padding:.05rem .55rem;border-radius:99px;background:var(--bubble);color:var(--muted)}
.badge.done{background:var(--grn-soft);color:var(--grn-ink)}
.meter{display:grid;gap:.45rem;background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:.7rem .9rem;font-weight:700}
.meter .top-line{display:flex;gap:.5rem;align-items:center}
.meter svg{width:28px;height:32px;flex:none}
.bar-out{height:12px;border-radius:99px;background:var(--bubble);border:1px solid var(--edge);overflow:hidden}
.bar-in{height:100%;background:var(--grn)}
.srcs{margin:0;padding-left:1.1rem;display:grid;gap:.35rem;font-size:.82rem;color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.back{min-height:46px;padding:0 .8rem;display:inline-flex;align-items:center;gap:.3rem;font-weight:700;font-size:.9rem;border-radius:14px}
.back svg{width:20px;height:20px}
.ctx{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:center;background:var(--sky-soft);color:var(--sky-ink);border-radius:16px;padding:.6rem .8rem;font-weight:600;font-size:.92rem}
.ctx svg{width:28px;height:28px}
.phone{background:var(--surface);border:1px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:var(--elev)}
.ph-top{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border-bottom:2px solid var(--soft)}
.ph-top > span:last-child{min-width:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:#13233a;flex:none;border:1px solid var(--edge)}
.ph-top b{display:flex;align-items:center;gap:.25rem;font-size:.95rem;line-height:1.2}
.ph-top small{display:block;color:var(--muted);font-size:.75rem}
.ph-call{display:grid;justify-items:center;gap:.15rem;padding:1rem .9rem .8rem;background:var(--bubble);border-bottom:2px solid var(--soft);text-align:center}
.ph-call .av{width:66px;height:66px;font-size:1.7rem;margin-bottom:.2rem}
.ph-call b{font-size:1.05rem;line-height:1.2} .ph-call small{color:var(--muted);font-size:.78rem}
.tick{width:16px;height:16px;flex:none}
.msgs{display:grid;gap:.5rem;padding:.9rem;min-height:9rem;align-content:start;background:var(--bg)}
.said{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bubble{background:var(--surface);border:2px solid var(--soft);border-radius:6px 12px 12px 12px;padding:.6rem .8rem;max-width:88%;justify-self:start}
.bubble.me{justify-self:end;background:var(--grn-soft);border-color:transparent;border-radius:12px 6px 12px 12px}
.linkcard{margin-top:.45rem;border:2px solid var(--soft);border-radius:12px;overflow:hidden;background:var(--bubble)}
.linkcard div{padding:.4rem .6rem;font-size:.8rem}
.linkcard u{color:var(--focus);word-break:break-all;font-weight:600}
.receipt{margin-top:.45rem;border:2px dashed var(--soft);border-radius:12px;padding:.5rem .7rem;background:var(--bg);font-size:.8rem}
.receipt b{display:block;font-size:1.05rem;color:var(--grn-ink)}
.blurimg{margin-top:.45rem;height:84px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--soft) 0 10px,var(--bubble) 10px 20px);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.vframe{position:relative;border-radius:16px;overflow:hidden;height:170px;background:linear-gradient(160deg,#3b4d5a,#1d2a33);display:grid;place-items:center}
.vframe svg{width:110px;height:110px;filter:blur(2.5px);opacity:.9}
.vframe .lbl{position:absolute;left:.6rem;top:.5rem;font-size:.72rem;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:.1rem .5rem;border-radius:8px}
.vframe .lbl.r{left:auto;right:.6rem;top:auto;bottom:.5rem}
.typing{display:flex;gap:4px;padding:.8rem .9rem}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5}
@media (prefers-reduced-motion:no-preference){.typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-4px);opacity:1}}}
.fake{font-size:.72rem;color:var(--muted);text-align:center;padding:.4rem;border-top:2px solid var(--soft)}
.ask{display:grid;grid-template-columns:56px 1fr;gap:.6rem;align-items:center}
.ask .say{border-radius:12px 12px 12px 6px;font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.25}
.choices{display:grid;gap:.7rem}
.choice{display:grid;grid-template-columns:44px 1fr;gap:.7rem;align-items:center;width:100%;min-height:66px;padding:.6rem .8rem;text-align:left;font-weight:600}
.choice .k{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;border:1px solid var(--edge);color:var(--ink);background:var(--bubble)}

.choice[disabled]{cursor:default;opacity:.45;transform:none}
.choice.picked{opacity:1;outline:3px solid var(--ink);outline-offset:2px}

.fb{border-radius:16px;padding:1rem;display:grid;gap:.6rem;border:1px solid var(--edge);box-shadow:var(--elev)}
.fb.warn{background:var(--yel-soft)} .fb.ok{background:var(--grn-soft)}
.fb-head{display:grid;grid-template-columns:48px 1fr;gap:.7rem;align-items:center}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.25}
.fb.warn .verdict{color:var(--yel-ink)} .fb.ok .verdict{color:var(--grn-ink)}
.ttag{justify-self:start;font-weight:700;font-size:.88rem;background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:.3rem .65rem}
.earn{display:flex;align-items:center;gap:.5rem;font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--grn-ink)}
.earn svg{width:30px;height:34px}
.levelup{background:var(--grn-soft);color:var(--grn-ink);border:1px solid var(--edge);border-radius:16px;padding:.6rem .9rem;font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-align:center}
details.more{background:var(--surface);border:1px solid var(--edge);border-radius:12px;padding:0 1rem}

.srcline{font-size:.78rem;color:var(--muted)}

.n-app{display:flex;align-items:center;gap:.45rem;font-size:.8rem;font-weight:700;color:var(--muted)}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

function qrSvg(){

    if(typeof qrcode === 'function'){
      const qr = qrcode(0,'M'); qr.addData(PAGE_URL); qr.make();
      const n = qr.getModuleCount(); let d = '';
      for(let y=0;y<n;y++){ let x=0; while(x<n){ if(qr.isDark(y,x)){ const s0=x; while(x<n && qr.isDark(y,x)) x++; d+=`M${s0} ${y}h${x-s0}v1h-${x-s0}z`; } else x++; } }
      return `<svg class="qr" viewBox="-3 -3 ${n+6} ${n+6}" shape-rendering="crispEdges" role="img" aria-label="Mã QR mở trang Lá chắn số 3T"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" fill="#ffffff"/><path d="${d}" fill="#13233a"/></svg>`;
    }
  }catch(_){}
  return qrSvgStatic();
}

function bubble(m){
  if(m.video) return `<div class="vframe">${ART.face}<span class="lbl">● Gọi video</span><span class="lbl r">Mạng yếu…</span></div>`;
  return `<div class="bubble pop ${m.me?'me':''}">${esc(m.t)}${m.receipt?`<div class="receipt">Biên lai chuyển khoản<b>${esc(m.receipt)}</b></div>`:''}${m.blur?'<div class="blurimg">[Ảnh đã bị làm mờ]</div>':''}${m.link?`<div class="linkcard"><div style="font-weight:700">${esc(m.lt)}</div><div><u>${esc(m.link)}</u></div></div>`:''}</div>`;
}
function playChat(id){
  const tok = ++playTok, s = SCEN[id], box = $('#msgs'), ask = $('#askBox');
  const isCall = s.ch==='call'||s.ch==='video';
  if(isCall) box.insertAdjacentHTML('beforeend', `<div class="said">${s.ch==='video'?'Trong cuộc gọi':'Người gọi nói'}</div>`);
  let i = 0;
  const done = ()=>{ ask.hidden = false; };
  if(reduceMotion()){ box.insertAdjacentHTML('beforeend', s.msgs.map(bubble).join('')); done(); return; }
  const step = ()=>{
    if(tok!==playTok) return;
    if(i>=s.msgs.length){ setTimeout(()=>{ if(tok===playTok) done(); }, 250); return; }
    const m = s.msgs[i];
    if(m.video || m.me){ box.insertAdjacentHTML('beforeend', bubble(m)); i++; setTimeout(step, 480); return; }
    box.insertAdjacentHTML('beforeend','<div class="bubble typing" aria-hidden="true"><i></i><i></i><i></i></div>');
    setTimeout(()=>{ if(tok!==playTok) return; box.lastElementChild.remove(); box.insertAdjacentHTML('beforeend', bubble(s.msgs[i++])); setTimeout(step, 300); }, 650);
  };
  step();
}
function pick(id, i){
  const s = SCEN[id], c = s.choices[i];
  const btns = [...document.querySelectorAll('.choice')];
  btns.forEach(b=>{ b.disabled = true; b.classList.toggle('picked', +b.dataset.i===i); });
  const r = $('#result');
  if(!c.ok){
    r.innerHTML = `<div class="fb warn pop" role="status"><div class="fb-head"><span>${mascot('worried')}</span><span class="verdict">Chưa an toàn</span></div>
      <p>${esc(c.fb)}</p><span class="ttag">${esc(c.tip)}</span><p>${esc(s.retry)} Chọn lại nhé!</p>
      <button class="btn yel" id="retry">Thử lại</button></div>`;
    $('#retry').onclick = ()=>{ btns.forEach(b=>{ b.disabled=false; b.classList.remove('picked'); }); r.innerHTML=''; btns[0].focus(); };
  } else {
    const before = levelOf(earned.size), first = !earned.has(id);
    earned.add(id); saveShields(); updateChip();
    const after = levelOf(earned.size);
    r.innerHTML = `<div class="fb ok pop" role="status"><div class="fb-head"><span>${mascot('wow')}</span><span class="verdict">Chính xác – đây là cách an toàn nhất</span></div>
      <p>${esc(c.fb)}</p><span class="ttag">${esc(c.tip)}</span>
      <span class="earn">${ART.miniShield}${first?'+1 khiên · ':''}Bạn có ${earned.size}/${TOTAL} khiên</span></div>
      ${first && after!==before?`<div class="levelup pop">Lên cấp: ${after}!</div>`:''}
      <details class="more"><summary>Câu hỏi thêm: ${esc(s.follow)}</summary><p>${esc(s.followA)}</p></details>
      <div class="sticker"><small>Câu mang về</small>${esc(s.take)}</div>
      <div class="row">${earned.size<TOTAL?`<button class="btn yel" id="drawBtn">Bốc tình huống tiếp</button>`:`<button class="btn" data-go="thanh-tich">Xem thành tích</button>`}
        <button class="btn ghost" data-go="luyen">Về kho tình huống</button></div>`;
    confetti();
  }
  r.firstElementChild.scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'start'});
}

function draw(){
  const pool = IDS.filter(inFilter);
  let cands = pool.filter(id=>!earned.has(id));
  if(!cands.length) cands = pool.length ? pool : IDS;
  if(cands.length>1) cands = cands.filter(id=>id!==lastDrawn && id!==route());
  const id = cands[Math.random()*cands.length|0];
  lastDrawn = id;
  const deck = $('#deck');
  if(deck && !reduceMotion()){ deck.classList.remove('shuffle'); void deck.offsetWidth; deck.classList.add('shuffle'); setTimeout(()=>showNotif(id), 480); }
  else showNotif(id);
}
function showNotif(id){
  const s = SCEN[id], ch = CH[s.ch], isCall = s.ch==='call'||s.ch==='video';
  const preview = (s.msgs.find(m=>m.t && !m.me)||{t:''}).t;
  const n = $('#notif');
  n.innerHTML = `<div class="notif">
    <div class="n-app">${ART[ch.i]}<span>${ch.l}</span><time>bây giờ</time></div>
    <div class="n-body"><span class="av" style="background:${s.avc}">${s.av}</span><span><b id="nTitle">${esc(s.sender)}${s.verified?ART.tick:''}</b><p>${esc(isCall?'Đang gọi cho bạn…':preview)}</p></span></div>
    <span class="n-tag">Tình huống bất ngờ · ${esc(s.title)}</span>
    <button class="btn" id="nOpen">${isCall?'Nghe máy':'Mở tin nhắn'}</button>
    <button class="btn ghost" id="nAgain">Bốc tình huống khác</button></div>`;
  n.hidden = false;
  $('#nOpen').focus();
  $('#nOpen').onclick = ()=>{ closeNotif(); go(id); };
  $('#nAgain').onclick = ()=>{ closeNotif(); draw(); };
}
function closeNotif(){ $('#notif').hidden = true; }
$('#notif').addEventListener('click', e=>{ if(e.target.id==='notif') closeNotif(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#notif').hidden) closeNotif(); });

function confetti(){
  if(reduceMotion()) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'); cv.hidden = false;
  const d = devicePixelRatio, W = cv.width = innerWidth*d, H = cv.height = innerHeight*d;
  const cols = ['#ff5b4f','#ffc23d','#22b573','#4cc2ff','#ff9fd0'];
  const P = Array.from({length:36},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*16*d,vy:(-Math.random()*16-6)*d,s:(6+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*5|0]}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += .55*d; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); ctx.restore(); });
    if(t-t0<1100) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.hidden = true; } })(t0);
}

function route(){ return (location.hash||'').slice(1) || 'home'; }
let lastRoute = null;
function render(){
  stopRead(); playTok++; closeNotif();
  const h = route();
  if(h==='hoc-3t' && lastRoute!=='hoc-3t') learnIdx = 0;
  if(h==='can-giup' && lastRoute!=='can-giup') helpState = null;
  lastRoute = h;
  if(SCEN[h]){ app.innerHTML = scenarioView(h); playChat(h); }
  else app.innerHTML = (views[h]||views.home)();
  $('#helpBar').hidden = (h==='can-giup');
  window.scrollTo(0,0);
  const t = app.querySelector('h1'); if(t){ t.tabIndex = -1; t.focus({preventScroll:true}); }
}
function go(v){ if(v===route()) render(); else location.hash = v; }

app.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const c = e.target.closest('.choice'); if(c && !c.disabled){ pick(app.querySelector('[data-scen]').dataset.scen, +c.dataset.i); return; }
  if(e.target.closest('#drawBtn')){ draw(); return; }
  if(e.target.closest('#nextL')){ learnIdx = Math.min(2, learnIdx+1); render(); return; }
  if(e.target.closest('#prevL')){ learnIdx = Math.max(0, learnIdx-1); render(); return; }
  if(e.target.closest('#resetBtn')){ earned.clear(); saveShields(); updateChip(); go('luyen'); return; }
  const fc = e.target.closest('[data-filter]'); if(fc){ filter = fc.dataset.filter; render(); return; }
  const st = e.target.closest('[data-state]');
  if(st){ helpState = st.dataset.state;
    document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed', b===st));
    const box = $('#stateBox'); box.innerHTML = stateHtml(helpState);
    box.scrollIntoView({behavior: reduceMotion()?'auto':'smooth', block:'start'}); return; }
  const cp = e.target.closest('[data-copy]');
  if(cp){ const v = cp.dataset.copy;
    try{ navigator.clipboard.writeText(v).then(()=>toast('Đã chép số '+v+'. Mở ứng dụng Điện thoại để gọi.'),()=>toast('Số cần gọi: '+v)); }catch(_){ toast('Số cần gọi: '+v); } }
});
$('#brand').onclick = ()=>go('home');
$('#helpBtn').onclick = ()=>go('can-giup');
$('#shieldChip').onclick = ()=>go('thanh-tich');
window.addEventListener('hashchange', render);

function updateChip(){ $('#shieldChip').innerHTML = `<span style="width:22px">${ART.miniShield}</span>${earned.size}/${TOTAL}`; }
$('#brandMascot').innerHTML = mascot('happy');
$('#sosIcon').innerHTML = ART.buoy;
$('#side').innerHTML = `${qrSvg()}<h3>Mở trên điện thoại</h3><p>Dùng camera điện thoại quét mã này. Chỉ tin mã có in kèm đúng địa chỉ:</p><span class="url">${PAGE_URL}</span>`;
updateChip();

const sizeBtn = $('#sizeBtn');
function setBig(on){ document.documentElement.classList.toggle('big',on); sizeBtn.setAttribute('aria-pressed',on); try{ localStorage.setItem('big',on?'1':'0'); }catch(_){} }
try{ if(localStorage.getItem('big')==='1') setBig(true); }catch(_){}
sizeBtn.onclick = ()=>setBig(!document.documentElement.classList.contains('big'));

const readLabel = $('#readLabel'); let reading = false;
function stopRead(){ try{ speechSynthesis.cancel(); }catch(_){} reading = false; readLabel.textContent = 'Nghe'; }
$('#readBtn').onclick = ()=>{
  if(!('speechSynthesis' in window)){ toast('Thiết bị này chưa hỗ trợ đọc. Bản chính thức sẽ có giọng đọc thu sẵn.'); return; }
  if(reading){ stopRead(); return; }
  const clone = app.cloneNode(true); clone.querySelectorAll('.foot,.fake,.k,.av,.share,svg,.back,.eyebrow,.srcline,.srcs,.deck,.filters').forEach(n=>n.remove());
  const u = new SpeechSynthesisUtterance(clone.innerText); u.lang = 'vi-VN'; u.rate = .9;
  const vi = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('vi'));
  if(vi) u.voice = vi; else toast('Máy chưa có giọng tiếng Việt, có thể đọc chưa chuẩn.');
  u.onend = u.onerror = ()=>{ reading = false; readLabel.textContent = 'Nghe'; };
  speechSynthesis.speak(u); reading = true; readLabel.textContent = 'Dừng';
};

let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden = true, 3000); }

render();
</script>
